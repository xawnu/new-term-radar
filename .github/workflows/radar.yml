name: New-term radar

# Manual runner fallback. Production is scheduled once daily by Cloudflare.
# State here is separate from the production R2 state.
#
# Off until you opt in: set the repository variable RADAR_ENABLED to "true"
# (Settings > Secrets and variables > Actions > Variables), add the secret AISA_API_KEY,
# and commit your config.json (remove it from .gitignore first; it holds no secrets).
# Optional secrets: GOANYAPI_API_KEY (related queries in the keyword table),
# RESEND_API_KEY, EMAIL_FROM, RADAR_EMAIL_TO (mail the reports),
# GSC_TOKEN_JSON (the Search Console signal).
#
# State (state/radar.db and the snapshots) lives in the Actions cache: one entry per
# run, restored by prefix, so the repository does not grow. A missing cache only means
# the next run builds new snapshots and reports nothing that day; the leads database
# would start over, so download the "radar-state" artifact now and then if you care
# about the review's history.

on:
  workflow_dispatch:
    inputs:
      command:
        description: "daily or sources"
        default: "daily"

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  radar:
    if: vars.RADAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMMAND: ${{ github.event.inputs.command || 'daily' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Restore the state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-

      - name: Run the radar
        env:
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
          GOANYAPI_API_KEY: ${{ secrets.GOANYAPI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RADAR_EMAIL_TO: ${{ secrets.RADAR_EMAIL_TO }}
        run: |
          if [ "$COMMAND" = "daily" ]; then
            python -m radar daily --out report.md ${RADAR_EMAIL_TO:+--mail}
          else
            python -m radar sources --out report.md ${RADAR_EMAIL_TO:+--mail}
          fi
          if [ -f report.md ]; then cat report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Save the state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}

      - name: Keep the report and the state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-${{ env.COMMAND }}-${{ github.run_id }}
          path: |
            report.md
            report.json
            state/radar.db
          if-no-files-found: ignore
          retention-days: 30
